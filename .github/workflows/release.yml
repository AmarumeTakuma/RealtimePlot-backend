name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Release for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Packaging
        run: |
          mkdir .\RealtimePlotBackend\
          mv .\application\RealtimePlotBackend.exe .\RealtimePlotBackend\
          mv .\application\realtimeplot_config.json .\RealtimePlotBackend\
          mv .\application\input\ .\RealtimePlotBackend\
          mv .\application\dummy_data\ .\RealtimePlotBackend\
          Compress-Archive -Path .\RealtimePlotBackend\ -DestinationPath .\RealtimePlotBackend-Windows.zip

      - name: Release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "RealtimePlotBackend-Windows.zip"

  macOS:
    name: Release for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Packaging
        run: |
          mkdir RealtimePlotBackend/
          mv ./application/RealtimePlotBackend ./RealtimePlotBackend/
          mv ./application/realtimeplot_config.json ./RealtimePlotBackend/
          mv ./application/input/ ./RealtimePlotBackend/
          mv ./application/dummy_data/ ./RealtimePlotBackend/
          zip RealtimePlotBackend-macOS.zip -r ./RealtimePlotBackend/

      - name: Release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "RealtimePlotBackend-macOS.zip"

  linux:
    name: Release for Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Packaging
        run: |
          mkdir RealtimePlotBackend/
          mv ./application/RealtimePlotBackend ./RealtimePlotBackend/
          mv ./application/realtimeplot_config.json ./RealtimePlotBackend/
          mv ./application/input/ ./RealtimePlotBackend/
          mv ./application/dummy_data/ ./RealtimePlotBackend/
          zip RealtimePlotBackend-Linux.zip -r ./RealtimePlotBackend/

      - name: Release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "RealtimePlotBackend-Linux.zip"
